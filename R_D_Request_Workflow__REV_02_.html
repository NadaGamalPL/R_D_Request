<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>R&amp;D Request Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: brand bar (logo + role) → title with the 85/15 track → tabs → view.
   Request view = stage list (left) + current stage, details and activity (right).
   Brand: Powerline Brand Book v2 — Power Orange #E85C1A · Carbon #111111 · Charcoal #3A3A3A · Panel Grey #CCCCCC · white; Archivo only. */
:root {
  --orange: #E85C1A; --carbon: #111111; --charcoal: #3A3A3A; --panel: #CCCCCC; --white: #FFFFFF;
  --bg: #F4F4F4; --surface: #FFFFFF; --soft: #F4F4F4; --line: #CCCCCC; --hair: #E4E4E4;
  --ink: var(--carbon); --ink-2: var(--charcoal); --accent: var(--orange); --accent-soft: #FCEDE5; --on-accent: #FFFFFF;
  --f: "Archivo", Arial, sans-serif;
  --r: 4px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
a { color: var(--orange); text-underline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--f); text-wrap: balance; }
.small { font-size: 12.5px; }
.muted { color: var(--ink-2); }
.mono { font-family: var(--f); font-weight: 600; letter-spacing: .02em; }
.num { white-space: nowrap; }

/* brand bar */
.brandbar { background: var(--white); border-bottom: 1px solid var(--line); }
.brandbar .in { max-width: 1180px; margin: 0 auto; padding-inline: 24px; padding-block: 14px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.brandbar .logo { height: 26px; width: auto; display: block; }
@media (max-width: 600px) { .brandbar .in { padding-inline: 16px; } .brandbar .logo { height: 22px; } }
.who-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who-box label { font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); }
.who-box select { width: auto; padding: 7px 34px 7px 11px; }
.mode-pill { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 9px; border-radius: var(--r); background: var(--accent-soft); color: var(--orange); }
.mode-pill.enforced { background: var(--soft); color: var(--ink-2); }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 24px; padding-block: 28px 56px; display: grid; gap: 22px; }
@media (max-width: 600px) { .wrap { padding-inline: 16px; padding-block: 20px 48px; } }

/* page title with the track */
.titleblock { display: grid; gap: 6px; justify-items: start; }
.label, .eb { font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); }
.titleblock h1 { font-weight: 800; font-size: clamp(26px, 3.6vw, 36px); letter-spacing: -.03em; line-height: 1.08; }
.track { display: block; height: 5px; width: 100%; max-width: 360px; background: var(--panel); margin-top: 6px; position: relative; }
.track::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 85%; background: var(--orange); }
.banner { border-radius: var(--r); padding: 11px 14px; font-size: 13px; background: var(--white); border: 1px solid var(--line); border-left: 4px solid var(--orange); }

/* tabs */
.tabs { display: flex; gap: 2px 22px; flex-wrap: wrap; align-items: flex-end; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 10px 0 11px; font-weight: 600; color: var(--ink-2); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--orange); }
.tab .count { font-size: 11px; font-weight: 700; min-width: 22px; padding: 1px 6px; border-radius: var(--r); background: var(--white); border: 1px solid var(--line); color: var(--ink); text-align: center; }
.tab .count.hot { background: var(--orange); border-color: var(--orange); color: var(--white); }
.tabs .spacer { flex: 1; }
.tabs .btn { margin-bottom: 8px; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--white); color: var(--ink); font-weight: 600; font-size: 13.5px; padding: 9px 16px; border-radius: var(--r); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; line-height: 1.2; }
.btn:hover:not(:disabled) { border-color: var(--charcoal); }
.btn.primary, .btn.good { background: var(--orange); border-color: var(--orange); color: var(--white); }
.btn.primary:hover:not(:disabled), .btn.good:hover:not(:disabled) { background: #D45213; border-color: #D45213; }
.btn.danger { border-color: var(--charcoal); color: var(--ink); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); padding-inline: 4px; }
.btn.ghost:hover:not(:disabled) { color: var(--ink); border-color: transparent; }
.btn.small { padding: 6px 11px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 22px 24px; min-width: 0; }
@media (max-width: 600px) { .card { padding: 18px 16px; } }
.stack { display: grid; gap: 16px; min-width: 0; }
h2.sec, .stack > h2 { font-size: 13px !important; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); }

/* status chips */
.chip { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: var(--r); white-space: nowrap; background: var(--soft); color: var(--ink-2); border: 1px solid transparent; }
.chip.ph { background: var(--accent-soft); color: var(--orange); }
.st-in_progress { background: var(--white); color: var(--orange); border-color: var(--orange); }
.st-on_hold { background: var(--white); color: var(--ink); border-color: var(--charcoal); }
.st-completed { background: var(--panel); color: var(--ink); }
.st-cancelled { background: var(--soft); color: var(--ink-2); text-decoration: line-through; }

/* task list */
.tasklist { display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r); padding: 15px 18px; cursor: pointer; text-align: left; width: 100%; }
.task:hover { border-color: var(--line); }
.task .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--panel); }
.tasklist.mine .task .bar { background: var(--orange); }
.task .t { font-weight: 700; font-size: 15px; }
.task .meta { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 4px 14px; flex-wrap: wrap; margin-top: 3px; }
.task .go { font-size: 13px; font-weight: 600; color: var(--orange); white-space: nowrap; }
@media (max-width: 560px) { .task { grid-template-columns: auto minmax(0, 1fr); } .task .go { grid-column: 2; } }
.empty { text-align: center; padding: 44px 20px; display: grid; gap: 12px; justify-items: center; }
.empty h3 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.empty p { margin: 0; max-width: 52ch; color: var(--ink-2); }

/* register table */
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-size: 10.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); padding: 10px 14px 10px 0; border-bottom: 1px solid var(--carbon); white-space: nowrap; }
td { padding: 12px 14px 12px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--soft); }
.filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.filters h2 { font-size: 20px !important; font-weight: 700; letter-spacing: -.02em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); padding: 3px; flex-wrap: wrap; gap: 2px; background: var(--white); }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 3px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); }
.late { color: var(--orange); font-weight: 700; }

/* request view */
.req-head { display: flex; flex-wrap: wrap; gap: 12px 18px; justify-content: space-between; align-items: flex-start; border-top: 3px solid var(--orange); }
.req-head .no { font-size: 11px; font-weight: 600; letter-spacing: .18em; color: var(--ink-2); }
.req-head h2 { font-size: 24px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
.req-grid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .req-grid { grid-template-columns: minmax(0, 1fr); } }
.req-grid > .card:first-child h3 { font-size: 11px !important; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.tl { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 16px; }
.tl:not(:last-child)::before { content: ""; position: absolute; left: 11px; top: 25px; bottom: 1px; width: 2px; background: var(--hair); }
.tl.done:not(:last-child)::before { background: var(--panel); }
.tl .dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--white); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink-2); position: relative; z-index: 1; }
.tl.done .dot { background: var(--panel); border-color: var(--panel); color: var(--ink); }
.tl.current .dot { background: var(--orange); border-color: var(--orange); color: var(--white); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl.skip .dot { border-style: dashed; background: var(--soft); }
.tl .tt { font-weight: 700; font-size: 13.5px; line-height: 1.3; }
.tl.locked .tt, .tl.skip .tt { color: var(--ink-2); font-weight: 500; }
.tl.current .tt { color: var(--orange); }
.tl .ts { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.opt { font-size: 9.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: 1px; }

.panel-head { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; margin-bottom: 18px; }
.panel-head h3 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.panel-head .sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; max-width: 70ch; }
.gate { border-radius: var(--r); padding: 12px 14px; font-size: 13px; display: grid; gap: 3px; background: var(--soft); border-left: 4px solid var(--panel); }
.gate b { font-weight: 700; }
.gate.lock { border-left-color: var(--orange); }
.gate.okk { border-left-color: var(--charcoal); }

/* forms */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
@media (max-width: 640px) { .form { grid-template-columns: minmax(0, 1fr); } }
.form .full { grid-column: 1 / -1; }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field > label, .field > .lab { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.req::after { content: " *"; color: var(--orange); }
input[type="text"], input[type="number"], input[type="date"], select, textarea { width: 100%; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--white); min-width: 0; }
select { appearance: none; padding-right: 36px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--charcoal) 50%), linear-gradient(135deg, var(--charcoal) 50%, transparent 50%);
  background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
input:hover, select:hover, textarea:hover { border-color: var(--charcoal); }
input:focus, select:focus, textarea:focus { border-color: var(--orange); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
input:disabled, select:disabled, textarea:disabled { background: var(--soft); color: var(--ink-2); }
select option:disabled { color: #9a9a9a; }
.err { color: var(--orange); font-size: 13px; font-weight: 600; }
.sectitle { font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); margin-top: 4px; }
.field.locked > label { color: var(--ink-2); font-weight: 500; }
.field.locked select, .field.locked input, .field.locked textarea { background: var(--soft); border-style: dashed; color: var(--ink-2); cursor: not-allowed; }
.lockn { font-size: 11.5px; font-weight: 500; color: var(--ink-2); }

.reqform { display: grid; gap: 30px; counter-reset: sec; }
.fs { display: grid; gap: 14px; border: 0; padding: 0; margin: 0; min-width: 0; }
.fs > legend { counter-increment: sec; font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); padding: 0 0 10px; margin-bottom: 4px; width: 100%; border-bottom: 1px solid var(--hair); }
.fs > legend::before { content: counter(sec, decimal-leading-zero) " — "; color: var(--orange); }
.fs > legend small { font-size: 11.5px; font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 6px; }
.other-slot { display: none; }
.form:has(select[name="type"] option[value="other"]:checked) .other-slot { display: grid; }
.just-other { display: none; }
.form:has(select[name="product.justification"] option[value="other"]:checked) .just-other { display: grid; }

.att { display: grid; gap: 8px; }
.att-item { border: 1px solid var(--hair); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px; background: var(--white); }
.att-item:has(> label input:checked) { border-color: var(--orange); }
.att-item > label { display: flex; gap: 10px; align-items: center; font-weight: 600; cursor: pointer; }
.att-item > label input { width: 18px; height: 18px; accent-color: var(--orange); }
.att-item .slot { display: none; gap: 8px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.att-item:has(> label input:checked) .slot { display: grid; }
@media (max-width: 640px) { .att-item .slot, .stage-slot { grid-template-columns: minmax(0, 1fr) !important; } }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 8px 12px; display: flex; gap: 10px; align-items: center; background: var(--white); min-width: 0; min-height: 42px; }
.drop input[type="file"] { font-size: 12.5px; min-width: 0; max-width: 100%; }
.drop .fname { font-size: 13px; overflow-wrap: anywhere; }
.drop .fname a { font-weight: 600; }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--hair); }
.attlist { display: grid; gap: 4px; }
.attlist a, .attlist span { overflow-wrap: anywhere; }
.copybox { display: grid; gap: 8px; }
.copybox textarea { min-height: 170px; font-size: 12.5px; }

/* details & activity */
.card > h3 { font-size: 11px !important; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 14px !important; }
.kv { display: grid; grid-template-columns: minmax(130px, 32%) minmax(0, 1fr); gap: 0; font-size: 13.5px; margin: 0; }
.kv dt, .kv dd { padding: 9px 0; border-bottom: 1px solid var(--hair); }
.kv dt { color: var(--ink-2); padding-right: 14px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
details.rec summary { cursor: pointer; padding: 15px 0; font-weight: 600; }
details.rec[open] summary { border-bottom: 1px solid var(--hair); margin-bottom: 10px; }
details.rec > div { padding-bottom: 14px; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 12.5px; }
.log li { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px; }
.log time { color: var(--ink-2); }

/* dialogs, people, toast */
dialog { border: 1px solid var(--line); border-top: 4px solid var(--orange); border-radius: var(--r); padding: 0; background: var(--white); color: var(--ink); width: min(580px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(58, 58, 58, .45); }
.dlg { padding: 22px 24px; display: grid; gap: 14px; }
.dlg h3 { font-weight: 700; letter-spacing: -.02em; }
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.person { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border-radius: var(--r); background: var(--soft); font-size: 12.5px; }
.person button { border: 0; background: none; cursor: pointer; color: var(--ink-2); padding: 0 5px; }
.sugg { display: grid; gap: 2px; border: 1px solid var(--line); border-radius: var(--r); padding: 4px; }
.sugg button { border: 0; background: none; text-align: left; padding: 6px 8px; border-radius: 3px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.sugg button:hover { background: var(--soft); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--white); color: var(--ink); padding: 11px 16px; border-radius: var(--r); font-size: 13.5px; font-weight: 600; z-index: 50; max-width: calc(100vw - 32px); border: 1px solid var(--line); border-left: 4px solid var(--orange); }
.foot { font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
.foot a { color: var(--ink); }
.foot .ask { color: var(--orange); font-weight: 600; text-decoration: none; }
@media (prefers-reduced-motion: no-preference) {
  .task, .btn, input, select, textarea { transition: border-color .15s, box-shadow .15s, background .15s; }
  .track::after { animation: fill 1.6s ease-out 1 both; }
  @keyframes fill { from { width: 0; } to { width: 85%; } }
}

/* date picker: working days only (Fri, Sat and Egyptian public holidays blocked) */
.dp { display: flex; gap: 6px; align-items: center; }
.dp-btn { flex: 1; display: inline-flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--white); cursor: pointer; font-weight: 600; min-width: 0; }
.dp-btn svg { color: var(--orange); flex: none; }
.dp-btn.empty { font-weight: 400; color: var(--ink-2); }
.dp-btn:hover { border-color: var(--charcoal); }
.dp-pop { position: absolute; z-index: 60; width: 300px; background: var(--white); border: 1px solid var(--line); border-top: 3px solid var(--orange); border-radius: var(--r); padding: 12px; box-shadow: 0 10px 28px rgba(17,17,17,.14); }
.dp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.dp-head b { font-weight: 700; }
.dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.dp-wk span { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); text-align: center; padding: 2px 0 4px; }
.dp-day { border: 0; background: none; border-radius: 3px; height: 34px; font-size: 13px; font-weight: 600; cursor: pointer; position: relative; }
.dp-day:hover:not(:disabled) { background: var(--accent-soft); color: var(--orange); }
.dp-day.today { box-shadow: inset 0 0 0 1px var(--charcoal); }
.dp-day.sel { background: var(--orange); color: var(--white); }
.dp-day:disabled { color: #B5B5B5; font-weight: 400; cursor: not-allowed; }
.dp-day.we:disabled { background: var(--soft); }
.dp-day.hol:disabled { text-decoration: line-through; }
.dp-day.hol::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--orange); }
.dp-hols { list-style: none; margin: 8px 0 0; padding: 8px 0 0; border-top: 1px solid var(--hair); display: grid; gap: 2px; font-size: 12px; color: var(--ink-2); }
.dp-hols b { color: var(--orange); display: inline-block; min-width: 18px; }
.dp-note { margin: 8px 0 0; font-size: 11.5px; color: var(--ink-2); }
.attlist a { font-weight: 600; }

/* ================= Bento layer =================
   Every view is a 12-column grid of rounded tiles on the light-grey page.
   Orange marks the one thing that needs attention; everything else stays white / grey. */
:root { --tile-r: 14px; --gap: 14px; --bg: #EFEFEF; --soft: #F5F5F5; --hair: #E6E6E6; }
body { background: var(--bg); }
.btn { border-radius: 8px; }
input[type="text"], input[type="number"], input[type="date"], select, textarea, .dp-btn, .drop { border-radius: 8px; }
.chip { border-radius: 999px; padding: 3px 10px; }
.card { border-radius: var(--tile-r); border-color: transparent; }
.brandbar { border-bottom-color: var(--hair); }
.wrap { gap: 18px; }
.tabs { border-bottom: 0; background: var(--white); border-radius: var(--tile-r); padding: 6px 8px 6px 18px; align-items: center; }

/* pipeline: one column per stage */

.pipe .pl { font-size: 11px; line-height: 1.25; color: var(--ink-2); min-height: 28px; }

/* compact list rows inside tiles */

.prog { font-size: 12.5px; font-weight: 600; }

.datelist { display: grid; gap: 0; }

.doclist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.doclist li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--soft); }
.doclist .ic { width: 34px; height: 40px; border-radius: 6px; background: var(--white); border: 1px solid var(--hair); display: grid; place-items: center; font-size: 9px; font-weight: 800; letter-spacing: .08em; color: var(--orange); position: relative; }
.doclist .ic::before { content: ""; position: absolute; top: -1px; right: -1px; width: 10px; height: 10px; background: linear-gradient(225deg, var(--bg) 50%, var(--hair) 50%); border-bottom-left-radius: 3px; }

.mini-kv { display: grid; grid-template-columns: minmax(110px, 40%) minmax(0, 1fr); font-size: 13px; margin: 0; }

.att-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }

/* request page: on narrow screens the action comes before the side column */
@media (max-width: 1000px) { .col.side { order: 2; } }
#stageForm { display: block; }
.panel-head { margin-bottom: 14px; }

/* new-request form as tiles */
.reqform { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); }
.reqform > .fs { background: var(--white); border-radius: var(--tile-r); padding: 20px 22px; grid-column: span 12; }
.reqform > .fs.f-req, .reqform > .fs.f-fam { grid-column: span 6; }
.reqform > .fs.f-att { grid-column: span 7; }

.reqform > .gate b { font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); }
.reqform > .fs.f-req .form, .reqform > .fs.f-fam .form { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 1000px) { .reqform > .fs.f-req, .reqform > .fs.f-fam, .reqform > .fs.f-att, .reqform > .gate { grid-column: span 12; } }
.tile .reqform > .fs, .tile .reqform > .gate { background: var(--soft); }
.stage-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.stage-chips span { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--soft); }

.form-tile { flex-direction: row; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.form-tile .err { flex-basis: 100%; }
.form-intro h2 { font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
.form-intro p { margin: 0; color: var(--ink-2); font-size: 13.5px; }

/* register */
.reg-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.reg-tools input[type="search"] { width: min(280px, 100%); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--white); }
.seg { border-radius: 10px; }
.seg button { border-radius: 7px; }
th { border-bottom-color: var(--hair); }
details.rec summary { padding: 0; }
details.rec[open] summary { margin-bottom: 12px; padding-bottom: 10px; }
.timeline { padding-top: 2px; }
.reqform > .fs > legend { float: left; width: 100%; padding: 0 0 10px; margin: 0 0 16px; }
.reqform > .fs > legend + * { clear: both; }
.reqform > .fs { display: block; }
.reqform .form { align-content: start; }
/* several attachments per stage */
.multi { display: grid; gap: 10px; }
.filelist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.filelist li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 6px 8px 12px; border-radius: 8px; background: var(--soft); font-size: 13px; min-width: 0; }
.filelist li a { font-weight: 600; overflow-wrap: anywhere; }
.filelist li a::before { content: "PDF"; display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: .06em; color: var(--orange); border: 1px solid var(--hair); background: var(--white); border-radius: 4px; padding: 1px 4px; margin-right: 8px; vertical-align: 1px; }
.multi label.btn { cursor: pointer; }
.multi textarea { min-height: 60px; }
.stage-atts { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; }
.stage-atts a, .stage-atts span { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--soft); text-decoration: none; overflow-wrap: anywhere; }
.stage-atts span { color: var(--ink-2); }
/* ===== Technical Feasibility & Costing Study (F02) form ===== */
.f02 { display: grid; gap: 14px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--hair); }
.f02-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.f02-h b { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }

.f02-sec .sectitle { margin: 0; color: var(--ink); }
.refgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 14px; align-items: end; }
.refgrid > div:not(.field) { display: grid; gap: 2px; font-size: 13px; min-width: 0; }
.refgrid > div > span { font-size: 11px; color: var(--ink-2); }

@media (max-width: 760px) { .refgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.srows { display: grid; gap: 6px; }
.srow { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) 34px; gap: 6px; align-items: center; }
.srows.mfg .srow { grid-template-columns: minmax(0, 1.4fr) minmax(0, .9fr) minmax(0, 1.2fr) 34px; }
.srow.hd span { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); padding-left: 2px; }
.srow input, .srow select { padding: 8px 10px; background: var(--white); }
.srow .btn.ghost { padding: 6px; font-size: 16px; color: var(--ink-2); justify-content: center; }
@media (max-width: 640px) {
  .srow, .srows.mfg .srow { grid-template-columns: minmax(0, 1fr) 34px; background: var(--white); border-radius: 10px; padding: 8px; }
  .srow > :not(button) { grid-column: 1; } .srow > button { grid-column: 2; grid-row: 1; }
  .srow.hd { display: none; }
}
.switch { display: inline-flex; gap: 10px; align-items: center; font-weight: 600; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--orange); }
.costgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; }
.costgrid .field input { background: var(--white); }

@media (max-width: 760px) { .costgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.costsum { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.costsum > div { background: var(--white); border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.costsum span { font-size: 12px; color: var(--ink-2); }
.costsum b { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.recs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 760px) { .recs { grid-template-columns: minmax(0, 1fr); } }
.rec { display: flex; gap: 10px; align-items: flex-start; background: var(--white); border: 1.5px solid var(--hair); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.rec input { margin-top: 3px; accent-color: var(--orange); }

.rec small { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.rec:has(input:checked) { border-color: var(--orange); background: var(--accent-soft); }
.rec-stop:has(input:checked) { border-color: var(--charcoal); background: var(--soft); }

.study-sum > div { background: var(--soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
.study-sum span { font-size: 11.5px; color: var(--ink-2); }
.study-sum b { font-size: 15px; font-weight: 800; }
@media (max-width: 560px) { .study-sum { grid-template-columns: minmax(0, 1fr); } }
/* ===== Sample Test Request (F03) ===== */
.f03 .ar-tag { font-family: 'IBM Plex Sans Arabic', 'Archivo', sans-serif; font-weight: 600; color: var(--ink-2); font-size: 14px; }
.f03 [dir=rtl], .f03 input[dir=rtl], .f03 textarea[dir=rtl] { font-family: 'IBM Plex Sans Arabic', 'Archivo', sans-serif; }
.f03 .f02-sec.locked { opacity: .6; }
.srows.tests .srow { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 34px; }
.letter { background: var(--white); border-radius: 10px; border-right: 4px solid var(--orange); padding: 16px 18px; font-family: 'IBM Plex Sans Arabic', 'Archivo', sans-serif; font-size: 14px; line-height: 1.85; }
.letter p { margin: 0 0 6px; }

.srows.atts .srow { grid-template-columns: minmax(0, 2fr) 104px minmax(0, 1.2fr) 34px; }
.srow .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.srow .chk input { width: 16px; height: 16px; accent-color: var(--orange); }
.f05 select { background: var(--white); }

/* ---- request timeline: horizontal stepper ---- */
.stepper-tile { padding: 22px 24px 18px; }
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 0; }
.stepper li { position: relative; display: grid; justify-items: center; text-align: center; gap: 4px; padding: 0 4px; min-width: 0; }
.stepper li::before { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 3px; background: var(--hair); z-index: 0; }
.stepper li:first-child::before { display: none; }
.stepper li.done::before, .stepper li.skip::before, .stepper li.current::before { background: var(--carbon); }
.stepper .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--white); border: 2px solid var(--panel); color: var(--ink-2); position: relative; z-index: 1; }
.stepper li.done .dot { background: var(--carbon); border-color: var(--carbon); color: var(--white); }

@media (max-width: 760px) {
  .stepper { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .stepper li { grid-template-columns: 28px minmax(0, 1fr) auto; justify-items: start; text-align: left; align-items: center; gap: 10px; }
  .stepper li::before { display: none; }
  .stepper b { margin: 0; }
}

/* ---- request timeline: vertical, with dates, time taken and the document of each step ---- */
.vt .tt { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.vt .when { margin-left: auto; font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.vt .took { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--ink-2); }
.vt .docs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.doc-chip { font: inherit; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--orange); background: var(--accent-soft); color: var(--carbon); cursor: pointer; }
.doc-chip:hover { background: var(--orange); color: var(--white); }
.th .doc-chip { border-color: var(--line); background: var(--white); }
.vt .tl.locked .docs .doc-chip { border-color: var(--line); background: var(--white); }

/* ---- new-request form ---- */
.hint { margin: 0; font-size: 12.5px; color: var(--ink-2); background: var(--white); border-radius: 8px; padding: 8px 10px; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick label { cursor: pointer; }
.pick input { position: absolute; opacity: 0; pointer-events: none; }
.pick span { display: inline-block; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--white); }
.pick input:checked + span { background: var(--carbon); border-color: var(--carbon); color: var(--white); }
.pick input:focus-visible + span { outline: 2px solid var(--orange); outline-offset: 2px; }
.pick.disabled span { opacity: .6; cursor: default; }
.mini-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.mini-steps li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; position: relative; font-size: 13px; font-weight: 600; }
.mini-steps li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--carbon); grid-column: 1; }
.mini-steps li:not(:last-child)::after { content: ""; position: absolute; left: 5px; top: 22px; height: calc(100% - 16px); width: 2px; background: var(--panel); }
.mini-steps li.on::before { background: var(--orange); }
.mini-steps li.ms-opt::before { background: var(--white); border: 2px dashed var(--panel); width: 8px; height: 8px; }
.mini-steps li.ms-opt { color: var(--ink-2); font-weight: 500; }
.mini-steps small { font-size: 11px; font-weight: 700; color: var(--ink-2); letter-spacing: .04em; }
.reqform > .fs.f-data .form { grid-template-columns: minmax(0, 1fr); }

.vt .tl.done .dot { background: var(--carbon); border-color: var(--carbon); color: var(--white); }
.vt .tl.done:not(:last-child)::before { background: var(--carbon); }
@media (max-width: 760px) { .stepper-tile { display: none; } }

/* ---- priority ---- */
.pri { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; background: var(--soft); color: var(--ink-2); white-space: nowrap; }
.pri::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--panel); }
.pri-urgent { background: var(--orange); color: var(--white); } .pri-urgent::before { background: var(--white); }
.pri-high { background: var(--accent-soft); color: var(--carbon); } .pri-high::before { background: var(--orange); }
.pri-low { background: var(--white); border: 1px solid var(--line); } .pri-low::before { background: var(--panel); }
.rq-head .row .pri { font-size: 12px; padding: 5px 11px; }
.plan-tile .pl-row .field { margin: 0; }
.plan-tile .pl-row { padding: 6px 0; border-bottom: 1px solid var(--hair); }
.plan-tile .datelist { display: grid; }
.plan-tile .pick span { padding: 6px 12px; font-size: 12.5px; }

/* ---- read-only stage view (anyone can follow the current stage) ---- */
.sv-grid { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px; margin-bottom: 12px; }
.sv-grid > div { background: var(--soft); border-radius: 10px; padding: 10px 12px; display: grid; gap: 3px; }
.sv-grid span { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.sv-grid b { font-size: 13.5px; } .sv-grid b.late { color: var(--orange); }
@media (max-width: 760px) { .sv-grid { grid-auto-flow: row; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.refgrid small { display: block; font-size: 11px; }

<script>
// ---------- reference data ----------
const ROLE = { tl: 'Requester', rd: 'R&D Engineer', srd: 'Senior R&D Engineer', ch: 'Chairman', qhse: 'QHSE Engineer' };
const FULL = ['rd', 'srd', 'ch']; // full authority over every stage
const DEPTS = [['sales', 'Sales'], ['bd', 'Business Development (BD)'], ['tendering', 'Tendering'], ['operations', 'Operations (Design / Production)'], ['procurement', 'Procurement'], ['pm', 'Project Management (PM)'], ['top', 'Top Management']];
const LEVELS = [['mv', 'MV – Medium Voltage'], ['lv', 'LV – Low Voltage']];
const PTYPES = {
  mv: [['mvsg', 'PLGEAR – MV Switchgear'], ['psec', 'PSEC – RMU, SF6 Switch'], ['pral', 'PRAL – RMU, Air Switch'], ['pcss', 'PCSS'], ['pdtr', 'Dry-Type Transformer (PDTR)'], ['pt', 'Voltage Transformers (PTs)'], ['ct', 'Current Transformers (CTs)'], ['other', 'Other']],
  lv: [['enclosure', 'Enclosure'], ['other', 'Other']],
};
const LEGACY_PT = { meters: 'Meters', accessories: 'Accessories', mdb: 'MDB / SMDB Panel', capacitor: 'Capacitor Bank (PFC)', oil: 'Oil-Immersed Transformer' };
const autoName = p => p?.level === 'mv' && p.ptype && p.ptype !== 'other' && (PTYPES.mv || []).some(([k]) => k === p.ptype); // MV standard types: Product Name = Product Type
function ptypeText(f) { const p = f?.product; if (!p?.level) return ''; if (!p.ptype) return p.level.toUpperCase(); const t = p.ptype === 'other' ? (p.ptypeOther || 'Other') : (LEGACY_PT[p.ptype] && !(PTYPES[p.level] || []).some(x => x[0] === p.ptype) ? LEGACY_PT[p.ptype] : label(PTYPES[p.level] || [], p.ptype)); return `${p.level.toUpperCase()} · ${t}`; }
const REL = [['elec', 'Electrical'], ['mech', 'Mechanical'], ['both', 'Both']];
const CAT = [['main', 'Main Component'], ['accessory', 'Accessory']];
const deptText = k => (k === 'ops_design' || k === 'ops_production') ? 'Operations (Design / Production)' : label(DEPTS, k);
function relText(f) { const r = f?.rel; if (r && typeof r === 'object') return r.mech && r.elec ? 'Both' : r.mech ? 'Mechanical' : r.elec ? 'Electrical' : '—'; return label(REL, r); }
const catText = f => f?.product?.category ? label(CAT, f.product.category) : '—';
const TYPES = [['npd', 'New Product Development'], ['develop', 'Developing Existing Product'], ['alternative', 'Feasibility / Component Alternative'], ['compliance', 'Compliance Request'], ['other', 'Other']];
const ALL_TYPES = TYPES.map(([k]) => k); // every department can raise every request type
const LEGACY_TYPES = { minor: 'Minor Design Change', feasibility: 'Feasibility Check' }; // merged types: older records keep their label
const TYPE_HINT = {
  npd: 'Design and qualify a product Powerline does not make yet.',
  develop: 'Change a current product, from a small design change to new ratings, size, cost or supplier. Prototype, test and EEHC only if needed.',
  compliance: 'Confirm a product complies with a customer or tender specification. R&D approves it and prepares the compliance submittal.',
  alternative: 'Check whether a product or specification can be made, or qualify another component or supplier. Type test and EEHC only if needed.',
  other: 'Anything else. Name it below; the R&D Engineer decides which steps apply.',
};
const TYPE_REL = { npd: ['both'], alternative: ['elec', 'mech'] }; // Relevant Department each type allows (others: any); one option = set automatically
const relOpts = t => REL.filter(([k]) => !TYPE_REL[t] || TYPE_REL[t].includes(k));
const TYPE_ATT = { npd: ['customer', 'competitor', 'spec'], develop: ['drawings', 'spec', 'customer'], alternative: ['supplier', 'spec', 'drawings'], compliance: ['spec', 'customer'], other: ['spec', 'customer', 'competitor', 'drawings', 'supplier'] };
const NAME_ONLY = (type, level) => level === 'lv' || type === 'npd'; // LV and New Product: the requester names the product, no product list
const ATT = [['spec', 'Reference Technical Specs'], ['customer', 'Customer Requirements'], ['competitor', 'Competitor Product Data'], ['drawings', 'Current Drawings / Design Files'], ['supplier', 'Supplier Datasheet / Offer']];
const JUST = [['cost', 'Cost Reduction'], ['customer_req', 'Customer / Tender Request'], ['competitor', 'Competitor Match'], ['quality', 'Quality / Field Issue'], ['other', 'Other']]; // why the business needs it; the request type says what R&D does
const JUST_HINT = { cost: 'What should cost less, and by how much? e.g. replace the busbar supplier, target −10 %', customer_req: 'Which customer or tender, and what does it ask for?', competitor: 'Which competitor, and which spec or feature to match?', quality: 'What issue, where was it seen, and how often?', other: 'What is the reason? One or two lines are enough' };
const reasonLine = f => [f?.product?.justification ? justText(f.product) : '', f?.statement || ''].filter(Boolean).join(' — '); // chip + statement read as one sentence
// older options kept only so existing records still read correctly (and map onto the current list when edited)
const LEGACY_JUST = { tender_spec: ['customer_req', 'Tender Specification Requirement'], open_po: ['customer_req', 'Open POs / Customer Orders'], new_market: ['other', 'New Market Opportunity'],
  design: ['other', 'Design Improvement'], production: ['other', 'Production Improvement'], safety: ['quality', 'Safety Improvement'], size: ['other', 'Size / Space Reduction'], lead_time: ['other', 'Shorter Lead Time'],
  field_issue: ['quality', 'Design or Field Issue'], supply: ['cost', 'Supplier / Local Sourcing'], shortage: ['other', 'Component Shortage'], supplier_price: ['cost', 'Supplier Price or Availability'],
  localization: ['cost', 'Local Manufacturing / Less Imports'], compliance: ['customer_req', 'Standard Compliance'], strategic: ['other', 'Strategic Decision'] };
// ---- form dependencies: what each requesting department sees ----
const DEPT_RULES = { // request types each department may raise, and the reasons it usually gives (shown first; every reason stays open)
  sales:       { types: ['npd', 'develop', 'compliance', 'other'], att: ['customer', 'competitor', 'spec'], qty: true,  just: ['customer_req', 'competitor', 'cost', 'other'] },
  bd:          { types: ['npd', 'alternative', 'other'], att: ['spec', 'customer', 'competitor'], qty: false, just: ['competitor', 'customer_req', 'cost', 'other'] },
  tendering:   { types: ['develop', 'alternative', 'compliance', 'other'], att: ['spec', 'customer', 'competitor'], qty: false, just: ['customer_req', 'competitor', 'cost', 'other'] },
  operations:  { types: ['develop', 'alternative', 'other'], att: ['drawings', 'spec'],               qty: false, just: ['quality', 'cost', 'other'] },
  procurement: { types: ['alternative', 'other'], att: ['supplier', 'spec'],               qty: true,  just: ['cost', 'quality', 'other'] },
  pm:          { types: ['develop', 'compliance', 'other'], att: ['spec', 'customer', 'drawings'],   qty: false, just: ['customer_req', 'quality', 'other'] },
  top:         { types: ALL_TYPES, att: ['spec', 'customer', 'competitor', 'drawings'], qty: false, just: ['cost', 'competitor', 'other'] },
};
// ---- which stages each request type goes through: 'req' required, 'opt' optional (can be skipped), 'off' not shown ----
const TYPE_STAGES = {
  npd:         { prototype: 'req', test: 'req', eehc: 'req' },
  develop:     { prototype: 'opt', test: 'opt', eehc: 'opt' },
  minor:       { prototype: 'opt', test: 'off', eehc: 'off' }, // older records only
  compliance:  { qhse_review: 'off', study: 'off', study_ok: 'off', prototype: 'off', test: 'off', eehc: 'off', full: 'off', submittal: 'req' },

async function notify(rid, ev, extra) { // fire-and-forget: never blocks the step that triggered it
  try {
    if (S.config.notify?.on === false) return;
    const r = S.requests.find(x => x.id === rid) || extra?.rec; if (!r) return;
    const sent = [], miss = [];
    for (const m of mailsFor(r, ev, extra)) {
      const to = [...new Set(m.to.filter(isEmail))];
      if (!to.length) { miss.push(`no email address for ${m.who}`); continue; }
      if (!S.mcp) { miss.push(`email can’t be sent from this view (${m.who})`); continue; }
      const args = { to, subject: m.subject, body: m.body };
      if (ev === 'approved') { try { const b = await requestPDF(r), u8 = new Uint8Array(await b.arrayBuffer()); let bin = ''; for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
        args.attachments = [{ content: btoa(bin), filename: `Request Form ${r.id}.pdf`, mimeType: 'application/pdf' }]; } catch (e) { console.error(e); } }
      try { await S.mcp.callTool('Gmail', 'send_message', args); sent.push(to.join(', ')); }
      catch (x) { miss.push(`${m.who}: ${mailError(x)}`); }
    }
    if (!sent.length && !miss.length) return;
    const cur = S.requests.find(x => x.id === rid) || r;
    await patch(cur, {}, [sent.length ? `Email sent to ${sent.join('; ')}` : '', miss.length ? `Email not sent – ${miss.join('; ')}` : ''].filter(Boolean).join(' · '));
    if (sent.length) toast(`Email sent to ${sent.join('; ')}`); else if (miss.length) toast('Email not sent – ' + miss[0]);
  } catch (e) { console.error(e); }
}

});

function normConfig(d) { d = d || {}; return { testMode: d.testMode !== false, roles: { tl: d.roles?.tl || [], rd: d.roles?.rd || [], srd: d.roles?.srd || [], ch: d.roles?.ch || [], qhse: d.roles?.qhse || [] }, holidays: Array.isArray(d.holidays) ? d.holidays : [],
